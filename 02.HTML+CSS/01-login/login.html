<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #1a1a1a, #3b1a4a);
            margin:0;
            padding: 0;
          height: 100vh;
            display:flex;
            justify-content: center;
            align-items: center;
        }
     h1 {
    color: blueviolet;
    text-align: center;
    margin-bottom: 10px;
}
.subtitle {
    text-align: center;
    color: #555;
    margin-top: 0;
    margin-bottom: 30px;
}
     .card {
    background-color: #d5d4d4;
    border-radius: 8px;
    padding: 35px;
    box-sizing: border-box;
   width: 100%;
    max-width: 450px;
    min-height: 400px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    animation: slideUp 0.6s ease;
    border: 1px solid rgba(255, 255, 255, 0.15);
}
@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}
        form{
            display: flex;
            flex-direction: column;
        }
        label {

    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}
input[type="email"],
input[type="password"] {
    padding: 12px;
    width: 100%;
    margin-bottom: 20px;
    border: 1px solid #ccc;
    border-radius: 6px;
    outline: none;
    font-size: 14px;
    background-color: white;
    box-sizing: border-box;
    transition: 0.3s;
}
input[type="email"]:focus,
input[type="password"]:focus {
    border-color: blueviolet;
}
.options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    font-size: 14px;
}
.options label {
    display: flex;
    align-items: center;
    gap: 5px;
    margin: 0;
}
.options input[type="checkbox"] {
    margin: 0;
    width: auto;
}
button {
    background-color: blueviolet;
    color: white;
    padding: 12px;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
}
        button:hover{
            background-color: #6a1bb1;
          transform: translateY(-2px);
        }
        button:active {
    transform: translateY(1px);
}
        .signup {
    text-align: center;
    margin-top: 25px;
    font-size: 14px;
}
.signup a {
   
    text-decoration: none;
}

.signup a:hover {
    text-decoration: underline;
}
    </style>
</head>
<body>
    <div class="card">
       <h1>Welcome Back!</h1>
<p class="subtitle">Login to continue</p>
        <form >
           <label for="email">Email</label>
<input type="email" id="email" placeholder="Enter your email">

<label for="password">Password</label>
<input type="password" id="password" placeholder="Enter your password">
<div class="options">

    <label>
        <input type="checkbox">
        Remember me
    </label>

    <a href="#">Forgot password?</a>

</div>
<button type="submit">Login</button>
<p class="signup">
    Don't have an account?
    <a href="#">Create Account</a>
</p>
        </form>
        
    </div>
</body>
</html>
